plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lingfen.bootanim'
    compileSdk 34

    defaultConfig {
        applicationId "com.lingfen.bootanim"
        minSdk 28
        targetSdk 34
        versionCode 6
        versionName "0.4.2"
    }

    buildTypes {
        release {
            minifyEnabled true              // R8：剔除未调用代码 + 剥离调试信息
            shrinkResources true            // 剔除未引用资源
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug   // 用 debug 签名，方便直接安装
        }
        debug {
            // 不加 .debug 后缀：保证覆盖安装同一个应用，避免出现两个图标
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig false
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/DEPENDENCIES',
                         '/META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
}
