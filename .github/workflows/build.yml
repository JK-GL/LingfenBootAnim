name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ubuntu-latest runner 自带 Android SDK（$ANDROID_SDK_ROOT），
      # 不用 android-actions/setup-android —— 它在非交互环境会卡在许可证提示。
      - name: Configure Android SDK
        run: |
          echo "SDK: $ANDROID_SDK_ROOT"
          SDKMAN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          ls -la "$SDKMAN" || echo "sdkmanager 不在预期路径"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMAN" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          echo "--- platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      # 本仓库只保留纯源码，不携带 Gradle Wrapper 二进制，
      # 这里显式安装 Gradle 8.7，与 gradle-wrapper.properties 声明的版本一致。
      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Show outputs
        if: always()
        run: |
          find app/build/outputs -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "没有 APK 产物"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lingfen-bootanim-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 30
